<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhantomGuard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        h1 { color: #333; font-size: 2em; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        button { background: #4CAF50; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #45a049; }
        .loading-spinner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div class="loading-spinner" id="loadingSpinner">
        <!-- Spinner CSS here -->
    </div>
    
    <div class="container">
        <h1>PhantomGuard</h1>
        <p>Your Ultimate Phone Security & Optimization Tool</p>
        <button onclick="handleStart()">Get Started</button>
    </div>

    <script>
        function handleStart() {
            // Show loading spinner
            document.getElementById('loadingSpinner').style.display = 'block';
            
            // Trigger permission request via JS Bridge
            // This will trigger onPermissionRequest in MainActivity
            window.AndroidBridge.requestPermissions();
            
            setTimeout(() => {
                document.getElementById('loadingSpinner').style.display = 'none';
                alert("Setup Complete!");
            }, 3000);
        }
    </script>
</body>
</html>
